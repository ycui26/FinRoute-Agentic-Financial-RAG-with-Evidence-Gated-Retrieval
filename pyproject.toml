[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finroute"
version = "1.0.0"
description = "Evidence-aware agentic RAG for financial filings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yue Cui"}]
dependencies = [
  "accelerate>=1,<2",
  "chromadb>=1,<2",
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<2",
  "numpy>=1.26,<3",
  "openai>=1,<3",
  "pandas>=2,<3",
  "pyarrow>=15",
  "pymupdf>=1.24,<2",
  "pyyaml>=6,<7",
  "rank-bm25>=0.2.2,<0.3",
  "sentence-transformers>=3,<6",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
finroute = "finroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
